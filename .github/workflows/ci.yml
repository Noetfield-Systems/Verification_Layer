name: Verification Layer — Build, Security & E2E
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verification
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: verification_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://verification:test-only@127.0.0.1:5432/verification_e2e?schema=public
      NOETFIELD_RECEIPT_SECRET: ci-receipt-secret-only-for-integration-tests-12345
      NOETFIELD_VERIFIER_SECRET: ci-verifier-secret-only-for-integration-tests-67890
      NOETFIELD_SINA_CONTROL_TOKEN: ci-operator-secret-only-for-integration-tests-43210
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: bun install --frozen-lockfile
      - name: Select PostgreSQL Prisma schema
        run: cp prisma/schema.postgres.prisma prisma/schema.prisma
      - name: Generate DB client and bootstrap disposable test database
        run: |
          bunx prisma generate
          bunx prisma db push --skip-generate
      - name: Deterministic engine regression
        run: node tests/engine-regression.cjs
      - name: ESLint
        run: bun run lint
      - name: TypeScript typecheck
        run: bunx tsc --noEmit
      - name: Next.js production bundle
        run: bun run build
      - name: Two-tenant HTTP end-to-end test
        run: node tests/e2e-api.mjs
      - name: Sina QA independent regression for issue #2 repair candidates
        if: startsWith(github.ref_name, 'sina/repair-issue-2-') || startsWith(github.head_ref, 'sina/repair-issue-2-')
        run: bun test tests/qa-relative-time.test.ts
      - name: Sina QA automations syntax
        run: |
          node --check scripts/sina-qa-watch.mjs
          node --check scripts/sina-qa-repair.mjs
          node --check scripts/sina-qa-promote.mjs
      - name: Docker image production build
        run: docker build -t verification-layer:ci .
